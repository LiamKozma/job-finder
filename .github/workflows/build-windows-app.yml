name: build-windows-app
# Builds JobFinder.exe on Windows, tests the real .exe, and publishes it as the download link:
# https://github.com/LiamKozma/job-finder/releases/latest/download/JobFinder.exe
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest -v
      - name: Test turning the daily search on and off (Task Scheduler)
        run: python -c "from jobfinder import schedule as s; s.enable('08:00'); assert s.is_enabled(), 'not enabled'; import subprocess; print(subprocess.run(['schtasks','/Query','/TN',s.TASK,'/V','/FO','LIST'],capture_output=True,text=True).stdout[:1500]); s.disable(); assert not s.is_enabled(); print('schedule OK')"
      - run: python -m pip install "pyinstaller>=6,<7"
      - name: Build JobFinder.exe
        run: pyinstaller --noconfirm --onefile --windowed --name JobFinder --add-data "config;config" --collect-submodules jobfinder JobFinder.pyw

      - name: Self-test the .exe (real search on one employer)
        shell: pwsh
        env:
          JOBFINDER_HOME: ${{ runner.temp }}\jf
        run: |
          $p = Start-Process -FilePath dist\JobFinder.exe -ArgumentList "--selftest" -Wait -PassThru
          Get-Content "$env:JOBFINDER_HOME\data\last-run.log" -Tail 8
          if ($p.ExitCode -ne 0) { Write-Error "selftest failed"; exit 1 }
          if (-not (Test-Path "$env:JOBFINDER_HOME\reports\latest.html")) { exit 1 }

      - name: Screenshot the app window
        continue-on-error: true
        shell: pwsh
        env:
          JOBFINDER_HOME: ${{ runner.temp }}\jf
        run: |
          $p = Start-Process dist\JobFinder.exe -PassThru
          Start-Sleep 10
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("app-window.png")
          Stop-Process $p -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        with:
          name: JobFinder-windows
          path: |
            dist/JobFinder.exe
            app-window.png

      - name: Publish the download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view app *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create app --title "Job Finder for Windows" --latest --notes "Download **JobFinder.exe** below and double-click it. If Windows shows 'Windows protected your PC', click **More info** then **Run anyway** (the app isn't code-signed)."
          }
          gh release upload app dist\JobFinder.exe --clobber
