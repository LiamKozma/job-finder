[project]
name = "jobfinder"
version = "0.1.0"
description = "Find fresh, real, well-matched job postings from public ATS job-board APIs"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
jobfinder = "jobfinder.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["jobfinder"]
